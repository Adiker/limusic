name: Prepare upstream release PR

on:
  workflow_dispatch:
  # Scheduling stays disabled until the separate release-promotion gate is implemented.

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-pr
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prepare sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/upstream-sync/sync.py
